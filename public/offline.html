<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#a52800">
    <title>Sin conexion | SuWork</title>
    <style>
        :root {
            color-scheme: light;
            --primary: #a52800;
            --text: #1f2a44;
            --muted: #6c7293;
            --surface: #ffffff;
            --page: #f7f8fc;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--page);
            color: var(--text);
        }

        main {
            width: min(100%, 420px);
            padding: 32px;
            border: 1px solid #e8ebf2;
            border-radius: 8px;
            background: var(--surface);
            box-shadow: 0 16px 38px rgba(25, 41, 80, 0.08);
            text-align: center;
        }

        img {
            width: 156px;
            height: auto;
            margin: 0 auto 24px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 24px;
            line-height: 1.2;
        }

        p {
            margin: 0 0 24px;
            color: var(--muted);
            line-height: 1.55;
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 8px;
            padding: 12px 16px;
            background: var(--primary);
            color: #ffffff;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
        <img src="/assets/img/suhomes-app-logo.png" alt="SuWork">
        <h1>Estas sin conexion</h1>
        <p>SuWork esta instalado, pero necesitas recuperar internet para consultar datos actualizados.</p>
        <button type="button" onclick="window.location.reload()">Reintentar</button>
    </main>
</body>
</html>
